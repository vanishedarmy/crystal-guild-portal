<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Crystal Guild Raid Overlay</title>
<style>
:root{color-scheme:dark;--edge:#dce8ff;--edge-dark:#53658f;--gold:#f1d88f;--cyan:#8fe7ff}
html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
body{display:grid;align-items:start;justify-items:center}
#wrap{position:relative;isolation:isolate;box-sizing:border-box;width:min(920px,94vw);margin:18px auto;padding:18px 22px;border:2px solid var(--edge-dark);border-radius:4px;background:linear-gradient(145deg,rgba(18,29,69,.97),rgba(5,10,31,.97));box-shadow:inset 0 0 0 1px rgba(235,244,255,.72),inset 0 0 0 4px rgba(46,65,117,.58),6px 6px 0 rgba(0,0,0,.48);display:none;overflow:hidden}
#wrap::before{content:"";position:absolute;inset:5px;z-index:-2;background:linear-gradient(rgba(7,10,29,.66),rgba(7,10,29,.82)),url('/retro-phase2/battle-vignette.webp') center 46%/cover no-repeat;opacity:.58;filter:saturate(.82) contrast(1.06)}
#wrap::after{content:"";position:absolute;inset:7px;z-index:-1;border:1px solid rgba(147,173,229,.26);pointer-events:none}
.top{display:flex;align-items:end;justify-content:space-between;gap:20px}
#boss{font-size:34px;font-weight:900;letter-spacing:.055em;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 #000,0 0 12px rgba(143,231,255,.35)}
#meta{font-size:15px;color:var(--gold);font-weight:700;text-align:right;text-shadow:1px 1px 0 #000}
.bar{height:26px;margin-top:12px;border-radius:2px;background:#050817;overflow:hidden;border:2px solid #6578a6;box-shadow:inset 0 0 0 1px #111a3c,2px 2px 0 rgba(0,0,0,.34)}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#a81831,#ef5b5b 62%,#ff9c92);box-shadow:inset 0 2px 0 rgba(255,255,255,.18);transition:width .35s steps(8,end)}
.row{display:flex;justify-content:space-between;gap:14px;margin-top:10px;font-size:18px;font-weight:700;text-shadow:1px 1px 0 #000}
#phase{color:var(--cyan)}
#status{color:var(--gold)}
#status.enraged{font-weight:900;color:#ff9ca8;text-shadow:1px 1px 0 #000,0 0 10px rgba(255,76,96,.45)}
#top{margin-top:10px;padding-top:8px;border-top:1px solid rgba(188,208,250,.25);font-size:14px;opacity:.96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px 0 #000}
@media(max-width:640px){#wrap{padding:14px 16px}.top,.row{align-items:flex-start;flex-direction:column;gap:5px}#meta{text-align:left}#boss{font-size:26px}.bar{height:22px}}
@media(prefers-reduced-motion:reduce){#hpbar{transition:none}}
</style>
</head>
<body>
<div id="wrap" role="status" aria-live="polite" aria-label="Crystal Guild raid status">
  <div class="top"><div id="boss">Crystal Guild</div><div id="meta"></div></div>
  <div class="bar" aria-hidden="true"><div id="hpbar"></div></div>
  <div class="row"><div id="hp"></div><div id="phase"></div><div id="status"></div></div>
  <div id="top"></div>
</div>
<script src="/raid-overlay.js" defer></script>
</body>
</html>
