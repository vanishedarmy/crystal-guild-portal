<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Crystal Guild Raid Overlay</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
body{display:grid;align-items:start;justify-items:center}
#wrap{box-sizing:border-box;width:min(920px,94vw);margin:18px auto;padding:18px 22px;border:1px solid rgba(145,201,235,.28);border-radius:18px;background:rgba(8,10,18,.84);box-shadow:0 8px 32px rgba(0,0,0,.45);display:none}
.top{display:flex;align-items:end;justify-content:space-between;gap:20px}
#boss{font-size:34px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
#meta{font-size:16px;opacity:.84;text-align:right}
.bar{height:28px;margin-top:12px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.25)}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#b2182b,#ef5b5b);transition:width .5s ease}
.row{display:flex;justify-content:space-between;gap:14px;margin-top:10px;font-size:18px}
#phase{font-weight:700}
#status.enraged{font-weight:800}
#top{margin-top:10px;font-size:14px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){#wrap{padding:14px 16px}.top,.row{align-items:flex-start;flex-direction:column;gap:5px}#meta{text-align:left}#boss{font-size:26px}}
@media(prefers-reduced-motion:reduce){#hpbar{transition:none}}
</style>
</head>
<body>
<div id="wrap" role="status" aria-live="polite" aria-label="Crystal Guild raid status">
  <div class="top"><div id="boss">Crystal Guild</div><div id="meta"></div></div>
  <div class="bar" aria-hidden="true"><div id="hpbar"></div></div>
  <div class="row"><div id="hp"></div><div id="phase"></div><div id="status"></div></div>
  <div id="top"></div>
</div>
<script>
const wrap=document.getElementById('wrap');
function hide(){wrap.style.display='none'}
async function refresh(){
  try{
    const r=await fetch('/api/overlay/state?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok){hide();return}
    const s=await r.json();
    const synced=Number(s.synced_at||0);
    if(!s.available||(synced&&Date.now()/1000-synced>120)){hide();return}
    if(!s.active&&!['VICTORY','WIPE'].includes(String(s.status||'').toUpperCase())){hide();return}
    wrap.style.display='block';
    document.getElementById('boss').textContent=s.boss||'Crystal Guild';
    document.getElementById('meta').textContent=[s.tier||'',`Raiders ${s.alive??0}/${s.raiders??0}`].filter(Boolean).join(' • ');
    const pct=Math.max(0,Math.min(100,((Number(s.hp)||0)/Math.max(1,Number(s.max_hp)||1))*100));
    document.getElementById('hpbar').style.width=pct+'%';
    document.getElementById('hp').textContent=(Number(s.hp)||0).toLocaleString()+' / '+(Number(s.max_hp)||0).toLocaleString()+' HP';
    document.getElementById('phase').textContent='R'+(Number(s.round)||0)+' • '+(s.phase||'Battle');
    const status=document.getElementById('status');
    status.textContent=(s.enraged?'ENRAGED • ':'')+'SUMMON '+(Number(s.summon_gauge)||0)+'%';
    status.className=s.enraged?'enraged':'';
    document.getElementById('top').textContent=(Array.isArray(s.top)?s.top:[]).map((x,i)=>'#'+(i+1)+' '+(x.name||'Adventurer')+' '+(Number(x.damage)||0).toLocaleString()+' dmg').join('   •   ');
  }catch{hide()}
}
setInterval(refresh,700);refresh();
</script>
</body>
</html>
